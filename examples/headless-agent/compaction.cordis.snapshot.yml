# Keyless context-overflow composition for the assembled compaction snapshot.
- id: base
  name: '@maple/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@maple/llm-deepseek'
        disabled: true
      - id: compaction-basic
        name: '@maple/compaction-basic'
        config:
          thresholdRatio: 0.99
          retainTokens: 20
          maxTokens: 32
      - insert:
          - id: llm-replay
            name: '@maple/llm-replay'
            config:
              providers:
                - id: deepseek-official
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000
