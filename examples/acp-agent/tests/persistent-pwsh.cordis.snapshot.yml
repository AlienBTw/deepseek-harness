# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-replay
  name: '@maple/llm-replay'
  config:
    providers:
      - id: deepseek-official
        name: DeepSeek
        models:
          - id: deepseek-v4-pro

- id: terminal
  name: '@maple/terminal'

- id: sandbox-policy
  name: '@maple/sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@maple/subprocess-local'

- id: terminal-pwsh
  name: '@maple/terminal-bash'
  config:
    shellDialect: pwsh
    timeoutMs: 30000

- id: acp-agent
  name: '@maple/acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh-persistent
  name: '@maple/tool-pwsh-persistent'
