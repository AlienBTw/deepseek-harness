[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "maple-harness-sdk"
version = "0.0.0.dev0"
description = "Python SDK for Maple Harness"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]
dependencies = [
  "pydantic>=2.12,<3",
  "maple-harness-runtime-bin==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/deepseek-ai/maple-harness"
Documentation = "https://github.com/deepseek-ai/maple-harness/blob/master/docs/user/guide/python-sdk.md"
Issues = "https://github.com/deepseek-ai/maple-harness/issues"
Source = "https://github.com/deepseek-ai/maple-harness"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/maple_harness"]

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
maple-harness-runtime-bin = { path = "../sdk-runtime", editable = true }
